# 前端容器 nginx 配置：静态托管 + /api 反代到后端容器（对应 Vite dev 的 proxy 行为）
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退（当前单页，保险配置）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api → backend 容器（去前缀，与 vite.config.js 的 rewrite 一致）
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        # SSE 流式必需：关闭缓冲，token 事件实时下发（开缓冲会攒包导致打字机卡顿）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # 流式回答可能持续较久
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }
}
